name: Apply ONS wealth typing fix

on:
  push:
    branches:
      - fix/ons-wealth-pandas-stubs-typing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ons-wealth-pandas-stubs-typing
      - name: Replace the broad idxmax label selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_pipeline_ons_wealth.py')
          text = path.read_text()
          old = '''def test_top_decile_is_largest(processed_df: pd.DataFrame) -> None:
              max_idx = processed_df["total_wealth_bn"].idxmax()
              # .loc returns a dynamically-typed pandas Scalar; the decile label is a string,
              # so str()-coerce it to make the membership test valid (no-op at runtime).
              assert "10th" in str(processed_df.loc[max_idx, "decile"]), (
                  "Top decile should hold the most wealth"
              )'''
          new = '''def test_top_decile_is_largest(processed_df: pd.DataFrame) -> None:
              largest_decile = (
                  processed_df.sort_values("total_wealth_bn", ascending=False)["decile"].iloc[0]
              )
              assert "10th" in str(largest_decile), "Top decile should hold the most wealth"'''
          if text.count(old) != 1:
              raise SystemExit('ONS wealth selector replacement marker not found exactly once')
          path.write_text(text.replace(old, new))
          PY
      - name: Publish the focused correction
        run: |
          grep -F 'processed_df.sort_values("total_wealth_bn", ascending=False)' tests/test_pipeline_ons_wealth.py
          git diff --check
          rm .github/workflows/fix-ons-wealth-typing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_pipeline_ons_wealth.py .github/workflows/fix-ons-wealth-typing.yml
          git commit -m "test: avoid broad pandas row-label selector"
          git push
