name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - "projects/wealthlens-dashboard/frontend/**"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    # Validate the isolated initial-route candidate stacked on the asset fix.
    branches: [main, fix/prerender-portable-assets]
    paths:
      - "projects/wealthlens-dashboard/frontend/**"
      - ".github/workflows/lighthouse.yml"
  # No weekly `schedule:` by design: ci-frontend carries the weekly drift catch-all,
  # but this Lighthouse-CI perf/a11y gate needs an app build + headless run and is
  # heavier/noisier on an idle schedule, so it runs on frontend PR/push only. Add a
  # cron here if scheduled Lighthouse-drift coverage is wanted.

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/wealthlens-dashboard/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/wealthlens-dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build + prerender in static-data mode so Lighthouse audits the exact
      # artifact GitHub Pages deploys (baked HTML, ADR 0001).
      - name: Build
        run: npm run build
        env:
          VITE_STATIC_DATA: "true"

      - name: Install chromium for prerender
        run: npx playwright install chromium --with-deps

      - name: Prerender routes
        run: npm run prerender

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Retain raw Lighthouse measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-results
          path: projects/wealthlens-dashboard/frontend/.lighthouseci/
          include-hidden-files: true
          retention-days: 7
