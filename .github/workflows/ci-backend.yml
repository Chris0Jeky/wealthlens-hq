name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - "projects/wealthlens-dashboard/backend/**"
      - "tests/**"
      - "automation/**"
      - "pyproject.toml"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
  # Weekly catch-all: the path-filtered triggers above don't fire while the backend
  # is idle, so a dependency/tooling drift (a new ruff/mypy/bandit release, or a
  # fastapi/pydantic bump) that breaks backend lint/type/security/tests would go
  # unnoticed until the next backend change. ci-backend is the ONLY gate that runs
  # mypy backend/, bandit on backend, and the backend pytest+coverage suite. Run
  # weekly regardless of paths, mirroring ci-analyst / ci-sim / ci-pipelines.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            projects/wealthlens-dashboard/backend/requirements.txt
            automation/data-pipelines/requirements.txt

      - name: Install backend dependencies
        run: pip install -r projects/wealthlens-dashboard/backend/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r automation/data-pipelines/requirements.txt

      - name: Install dev tools
        run: |
          pip install ".[dev]"
          pip install "pytest-cov>=7.1.0"

      - name: Ruff check
        run: |
          ruff check projects/wealthlens-dashboard/backend/
          ruff check automation/
          ruff check tests/

      - name: Mypy
        run: |
          mypy projects/wealthlens-dashboard/backend/
          # automation/ is now type-checked in ci-pipelines.yml (it has the pipeline
          # deps + .[dev] that automation imports need). Only root tests/ remains
          # ungated — it needs an mypy_path config for the backend/pipeline modules
          # its conftest wires onto sys.path at runtime (tracked in tasks/inbox.md).
          # mypy tests/

      - name: Bandit security scan
        run: |
          bandit -r projects/wealthlens-dashboard/backend/ -c pyproject.toml
          bandit -r automation/ -c pyproject.toml

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
        working-directory: projects/wealthlens-dashboard/backend

  # Runtime coverage on the newest resolvable dependencies (#602). requirements-dev.txt
  # and the root .[dev] extra cap numpy<2.5 so mypy's python_version = "3.11" target can
  # parse the stubs (#574); that cap must not hide a runtime break on newer NumPy. This
  # job installs ONLY the uncapped runtime requirements (plus test tools) on the newest
  # supported interpreter, where NumPy 2.5+ resolves, and runs the backend tests. No
  # lint/type step: the typed gate stays in lint-and-test on 3.11.
  runtime-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uncapped runtime dependencies
        run: |
          pip install -r projects/wealthlens-dashboard/backend/requirements.txt
          pip install -r automation/data-pipelines/requirements.txt
          pip install "pytest>=9.0.3" "httpx>=0.27"
          python -c "import numpy, pandas; print('numpy', numpy.__version__, 'pandas', pandas.__version__)"

      - name: Run backend tests
        run: python -m pytest tests/ -q
        working-directory: projects/wealthlens-dashboard/backend
