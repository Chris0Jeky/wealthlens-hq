version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/projects/wealthlens-dashboard/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/automation/data-pipelines"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Microsimulator package — deps (numpy/pandas/scipy/pydantic/pyyaml) live only in
  # its own pyproject.toml; the root "/" entry does not recurse into it.
  - package-ecosystem: "pip"
    directory: "/packages/wealthlens-sim"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/projects/wealthlens-dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # init/autobuild/analyze are three paths into ONE action repo and must run
      # the same version: init writes a config file stamped with its version and
      # autobuild refuses a mismatch ("Loaded a configuration file for version
      # 'X', but running version 'Y'"). Bumped separately, each PR is red until
      # its siblings land, so keep them in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
