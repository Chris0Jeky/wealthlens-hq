<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="t d" data-poster-time="13.7"><title id="t">WealthLens UK: from a cited source to an accessible chart (animated)</title><desc id="d">Animated loop with an illustrative line shape: a source record with its URL and access date enters the registry, a reproducible pipeline fetches and processes it into a CSV, the chart draws the top 1 percent and top 10 percent wealth share lines, a keyboard focus walks the points with screen-reader labels, the source citation is shown, dark mode toggles, and the chart can be embedded.</desc><style>.flow{stroke-dasharray:2 10;animation:fl 1.2500s linear infinite}@keyframes fl{to{stroke-dashoffset:-12}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}@media (prefers-reduced-motion:reduce){.rm0{opacity:1!important}.rm1{fill:#eeeeee!important}.rm2{stroke-dashoffset:0px!important}.rm3{opacity:0!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14110f"/><stop offset="1" stop-color="#25201b"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter></defs><rect width="1280" height="540" fill="url(#bg)"/><text x="48" y="58" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="30" fill="#f4efe6">WealthLens UK</text><text x="282" y="58" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="18" fill="#e11d48">every chart cites its source</text><text x="48" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#a39887">source registry · reproducible pipelines · WCAG AA · keyboard navigable · shareable and embeddable</text><g filter="url(#sh)"><rect x="40" y="108" width="330" height="370" rx="10" fill="#1c1814" stroke="#a39887" stroke-opacity=".35"/></g